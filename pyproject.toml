[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "saimon"
version = "1.0.0"
description = "Forward model, detection thresholds and ACE-FTS analyses behind 'Design of a dedicated solar-occultation satellite for monitoring stratospheric aerosol injection'"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "netCDF4>=1.6", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["saimon"]
